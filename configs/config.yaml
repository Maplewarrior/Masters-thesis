# @package _global_

defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

# Weights & Biases logging
wandb:
  enabled: true
  mode: "offline"
  project: "unlearning-experiments"
  dir: "./experiments/wandb"

# Data generation parameters
data:
  n_samples: 1000
  n_features: 25
  n_classes: 4
  n_informative: 25
  n_redundant: 0
  n_outliers: 50
  outlier_scale: 4.0
  outlier_variance: 0.4
  outlier_class: null
  random_state: 42
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Model configuration
model:
  n_features: 25
  n_classes: 4
  n_epochs: 20

# Forget set configuration
forget:
  n_points: 50
  class_idx: null
  ood_ratio: 0.5

# System settings
system:
  device: "cpu"
  seed: null

# Experiment configuration
experiment:
  mode: "experiment"
  unlearn_type: "ssd"
  n_repeats: 5
  n_epochs: 50
  n_forget_trials: 5
  experiment_id: null  # Will be auto-generated
  experiment_group: "default_group"
  track_performance: false

hydra:
  output_subdir: null
  run:
    dir: .