# Weights & Biases logging
wandb:
  enabled: false
  mode: "offline"  # "online" or "offline"
  project: "unlearning-experiments"
  dir: "./experiments/wandb"

# Data generation parameters
data:
  n_samples: 1000
  n_features: 25
  n_classes: 4
  n_informative: 25
  n_redundant: 0
  n_outliers: 50
  outlier_scale: 2.0
  outlier_variance: 0.4
  # outlier_class: null # Default to None
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Model configuration
model:
  n_features: 25
  n_classes: 4
  n_epochs: 20

# Forget set configuration
forget:
  n_points: 50
  class_idx: null  # Set to a specific class index or null
  ood_ratio: 0.5

# System settings
system:
  device: "cuda"  # "cpu", "cuda", or "mps"
  seed: 42

# Experiment configuration
experiment:
  mode: "experiment"  # "experiment", "visualize", or "get_latex_results"
  unlearn_type: "ssd"  # Type of unlearning method to use
  n_repeats: 30
  n_epochs: 50
  n_forget_trials: 10
  experiment_id: "auto"  # Will be auto-generated if set to "auto"
  experiment_group: "default_group"