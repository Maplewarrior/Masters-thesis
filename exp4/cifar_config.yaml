# @package _global_
absolute_root_path: /work3/s204138/MachineUnlearning #local # if this is set to "local" we use the __file__ to infer the absolute directory. Otherwise provide and absolute path.

defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

# Weights & Biases logging
logging:
  logger: "wandb" # wandb, sqlite, or disabled
  project: "machine-unlearning"
  name: "experiment_4"
  group: "synthetic_data_evaluation"
  dir: "./logs/wandb"
  wandb: 
    mode: online #"offline"


# Data generation parameters
data:
  dataset_name: "CIFAR10" #"MNIST"
  subsample_size: #MNIST: 10000
  n_forget_points: 150 # MNIST: 150
  batch_size: 128 #MNIST: 16
  n_classes: 10
  n_channels: 3
  image_size:
    - 224 #32
    - 224 #32
  patch_size:
    - 16 #4
    - 16 #4


trainer: 
  lr: 0.0001 #MNIST: 0.001
  n_epochs: 20 # MNIST: 30
  disable_tqdm: False
  do_early_stopping: False # MNIST: True
  weight_decay: 0.001 # MNIST: 0.0
  optimizer_name: AdamW
  lr_scheduler: cosine_annealing

sisa:
  n_shards: 5
  n_slices: 5
  model_type: #'neural-network' # vision-transformer
  neural_network_parameters: # constituent model parameters
    width_factor: 2 # MNIST: 4
    n_layers: 3 # MNIST: 3

amnesiac:
  gradient_checkpoint_dir: /work3/s204138/MachineUnlearning #/Users/michaelharborg/Desktop/Masters-thesis/exp4/weights

model: 
  seed: 50 #MNIST: 42
  model_type: vision-transformer #'neural-network'
  neural_network_parameters:
    width_factor: 4 # MNIST: 4
    n_layers: 3 # MNIST: 3
  vision_transformer_parameters:
    d_hidden: 192
    d_ff: 768
    d_k: 64
    n_layers: 12
    n_heads: 3
    tau: 64 # sqrt(tau) is used for scaling in self attention
    dropout_prob: 0.1
    pooling_type: mean

unlearn:
  method: "retrain"

