# @package _global_
absolute_root_path: /work3/s204138/MachineUnlearning #local # if this is set to "local" we use the __file__ to infer the absolute directory. Otherwise provide and absolute path.

defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

# Weights & Biases logging
logging:
  logger: "wandb" # wandb, sqlite, or disabled
  project: "machine-unlearning"
  name: "experiment_4"
  group: "synthetic_data_evaluation"
  dir: "./logs/wandb"
  wandb: 
    mode: "offline"


# Data generation parameters
data:
  dataset_name: "MNIST" #"CIFAR10" #"MNIST"
  subsample_size: #10000
  n_forget_points: 150
  batch_size: 16 #16
  n_classes: 10


trainer: 
  lr: 0.001
  n_epochs: 30 #50
  disable_tqdm: False
  do_early_stopping: False

sisa:
  n_shards: 3
  n_slices: 3

amnesiac:
  gradient_checkpoint_dir: /work3/s204138/MachineUnlearning #/Users/michaelharborg/Desktop/Masters-thesis/exp4/weights

model: 
  seed: 42
  device: "cpu"
  model_type: 'neural-network'
  neural-network-parameters:
    width_factor: 4 #4
    n_layers: 3 #3
  vision_transformer_parameters:
    d_hidden: 384
    d_ff: 768
    d_k: 36
    n_layers: 4
    n_heads: 6
    tau: 36


unlearn:
  method: "retrain"

